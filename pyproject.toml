[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpace"
dynamic = ["version"]
description = "桌面壁纸自动切换器 — Windows 小工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
# 开发/测试工具链（E4）。三者的版本下限均已核实为真实存在的发布版本，
# 避免声明不存在的大版本号导致 `pip install -e ".[dev]"` 直接失败。
# 安装：pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "mypy>=2.0",
]

[project.scripts]
wallpace = "src.main:main"

[tool.setuptools.dynamic]
# 版本号单一真源 = src/__init__.py::__version__（E6/D6）。
# setuptools 优先用静态 AST 解析该属性，不会触发运行时导入。
version = { attr = "src.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
# 与 requires-python 保持一致；该值会影响 UP 系列（PEP 585/604）的判定结果，
# 写死可保证统计数字可复现。
target-version = "py310"
extend-exclude = ["build", "dist", ".pytest-tmp"]

[tool.ruff.lint]
# 必须显式钉死规则集：ruff 的默认规则集随版本变化，不钉死将来升级会凭空变红。
select = ["E4", "E7", "E9", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 中文全角标点误报：实测 1601 条，必须关
]

